name: Verify

# Deploys nothing. deploy.yml runs after this passes on main.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest

    # The database tests (*.db.test.ts) skip without DATABASE_URL. This service
    # gives them one, so grading, rounds and login run against real Postgres here.
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: remediate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d remediate"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'yarn'
          cache-dependency-path: 'yarn.lock'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn run lint

      - name: Typecheck
        run: yarn run check

      # Migrations, not push: this also proves drizzle/ builds the schema from empty.
      - name: Database schema
        env:
          DATABASE_URL: postgres://postgres:dev@localhost:5432/remediate
        run: |
          node --input-type=module -e "import postgres from 'postgres'; const sql = postgres(process.env.DATABASE_URL); await sql\`create extension if not exists vector\`; await sql.end();"
          yarn db:migrate
          # A schema.ts change without its migration leaves generate something to write.
          yarn db:generate
          test -z "$(git status --porcelain drizzle)" || { git status --porcelain drizzle; exit 1; }

      - name: Unit and database tests
        env:
          DATABASE_URL: postgres://postgres:dev@localhost:5432/remediate
        run: yarn run test:server

      # Actions owns the build signal. Without this the only proof the app
      # compiles came from the Vercel Git integration, so a project-settings
      # fault and a genuine build break were indistinguishable from here.
      - name: Build
        run: yarn run build

      # The study loop in Chromium against the service database. Catches what unit
      # tests cannot, such as a Svelte effect that loops (see e2e/study.test.ts).
      - name: Install Chromium
        run: yarn playwright install --with-deps chromium

      - name: End-to-end tests
        env:
          DATABASE_URL: postgres://postgres:dev@localhost:5432/remediate
        run: yarn run test:e2e
